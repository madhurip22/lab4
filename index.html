<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>WA COVID-19 Death Rate</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body { margin:0; padding:0; }
#map { height:100vh; }
.legend {
    line-height:18px;
    color:#555;
    background:white;
    padding:8px;
    border-radius:5px;
}
.legend i {
    width:18px;
    height:18px;
    float:left;
    margin-right:8px;
}
</style>
</head>
<body>
<h2 style="text-align:center;margin:10px;">WA COVID-19 Death Rate per 10,000</h2>
<div id="map"></div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let map = L.map('map').setView([47.5,-120.5],6.5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

function getColor(d){
    return d>30?'#4d004b':d>25?'#810f7c':d>20?'#88419d':d>15?'#8c6bb1':d>10?'#8c96c6':d>5?'#9ebcda':'#e0ecf4';
}

fetch("assets/wa-covid-data-102521.geojson")
.then(r=>r.json())
.then(d=>{
    console.log(d.features[0].properties);
    L.geoJson(d,{
        style: f=>({fillColor:getColor(f.properties.deathPer10k),weight:1,color:'#333',fillOpacity:.75}),
        onEachFeature: (f,l)=>l.bindPopup(f.properties.name+': '+f.properties.deathPer10k+' per 10k')
    }).addTo(map);
});

let legend = L.control({position:'bottomright'});
legend.onAdd=function(){
    let d=L.DomUtil.create('div','legend');
    let grades=[0,5,10,15,20,25,30];
    for(let i=0;i<grades.length;i++){
        d.innerHTML+='<i style="background:'+getColor(grades[i]+1)+'"></i>'+grades[i]+(grades[i+1]?'–'+grades[i+1]+'<br>':'+');
    }
    return d;
};
legend.addTo(map);
</script>
</body>
</html>
